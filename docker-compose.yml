services:

  api:
    build:
      context: ./backend

    container_name: devflow-api

    environment:
      DATABASE_URL: postgresql+psycopg://devflow:devflow@postgres:5432/devflow
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://devflow:devflow@postgres:5432/devflow
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      AI_MAX_FILES: ${AI_MAX_FILES:-20}
      AI_MAX_DIFF_CHARS: ${AI_MAX_DIFF_CHARS:-20000}
      AI_MAX_TOTAL_INPUT_CHARS: ${AI_MAX_TOTAL_INPUT_CHARS:-100000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANALYZER_TIMEOUT_SECONDS: ${ANALYZER_TIMEOUT_SECONDS:-30}
      MAX_SOURCE_BYTES_PER_FILE: ${MAX_SOURCE_BYTES_PER_FILE:-1000000}
      MAX_FILES: ${MAX_FILES:-20}
      MAX_PATCH_CHARS_PER_FILE: ${MAX_PATCH_CHARS_PER_FILE:-20000}
      MAX_TOTAL_PATCH_CHARS: ${MAX_TOTAL_PATCH_CHARS:-100000}
      GITHUB_CHECKS_ENABLED: ${GITHUB_CHECKS_ENABLED:-true}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-/run/secrets/github-app.pem}
    volumes:
      - ./.secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: devflow-postgres

    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow -d devflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: devflow-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
